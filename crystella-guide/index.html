<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: one chat column in the Crystella brand; suggestions as pickable cards, then a full crystal guide rendered in the conversation */
:root{
  --bg:#211B2E; --panel:#2A2339; --raise:#352C47; --ink:#F1ECF8; --muted:#B3A8C6; --line:#43385A;
  --violet:#9F76FF; --violet-soft:#3B2F5C; --warn:#F2B66D; --ok:#7FD1A0;
  --script:"Pacifico", "Brush Script MT", cursive;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:640px;margin:0 auto;height:100%;max-height:900px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--violet-soft);display:grid;place-items:center;flex:none}
.top .name{font-weight:600}.top .sub{font-size:12px;color:var(--muted)}
.brand{margin-left:auto;text-align:right;line-height:1.1}.brand .w{font-family:var(--script);color:var(--violet);font-size:17px}.brand .by{font-size:9px;letter-spacing:.18em;color:var(--violet)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:9px 13px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.m.t{align-self:flex-start;background:var(--raise);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:var(--violet);color:#1A1424;border-bottom-right-radius:4px}
.m.wide{max-width:100%;width:100%}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m a{color:var(--violet);font-weight:600}
.flag{display:inline-block;font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 6px;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:4px;border:1px solid rgba(255,255,255,.3)}
.opt .nm{font-weight:600}.opt .why{font-size:14px;color:var(--muted)}
.opt button{margin-left:auto;flex:none}
.pick{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;border:0;background:var(--violet);color:#1A1424;cursor:pointer}
.guide h3{margin:12px 0 4px;font-size:15px}
.guide h3:first-child{margin-top:0}
.guide ul{margin:0;padding-left:18px}.guide li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:4px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ok{color:var(--ok)}.no{color:var(--warn)}
.aff{border-left:3px solid var(--violet);padding:6px 10px;background:var(--bg);font-style:italic}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.q{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--violet);background:transparent;color:var(--ink);cursor:pointer}
.q:hover{background:var(--violet-soft)}
form{display:flex;gap:8px;padding:0 16px 14px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.send{font:inherit;font-weight:600;padding:0 16px;border:0;border-radius:8px;background:var(--violet);color:#1A1424;cursor:pointer}
.q:focus-visible,.send:focus-visible,.pick:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.foot{max-width:640px;margin:10px auto 0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

const $=id=>document.getElementById(id);const log=$("log");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function suggest(found){
 const seen=new Set();const picks=[];
 found.forEach(c=>c.list.forEach(k=>{if(!seen.has(k)&&picks.length<3){seen.add(k);picks.push(k)}}));
 const label=found.map(c=>c.l.toLowerCase()).join(" and ");

 const methods=[];
 methods.push('<li><span class="ok">Moonlight:</span> leave it on a windowsill overnight, ideally on a full moon. Safe for every crystal.</li>');
 methods.push('<li><span class="ok">Smoke:</span> pass it through incense, sage or dhoop smoke for 30 to 60 seconds.</li>');
 methods.push('<li><span class="ok">Sound:</span> ring a bell or singing bowl near it for 2 to 3 minutes.</li>');
 if(k!=="selenite")methods.push('<li><span class="ok">Selenite:</span> rest it on a selenite plate for 4 hours or more.</li>');
 methods.push(x.water?'<li><span class="ok">Water:</span> rinse under cool running water for 30 to 60 seconds, then pat dry.</li>':`<li><span class="no">No water:</span> ${x.n} is water-sensitive and can crack, rust or dissolve. Use moonlight, smoke or sound instead.</li>`);
 methods.push(x.sun?'<li><span class="ok">Sunlight:</span> 15 to 30 minutes of early morning sun to charge it.</li>':`<li><span class="no">Avoid sun:</span> ${x.n}'s colour can fade in direct sunlight. Charge it in moonlight.</li>`);
 if(!x.salt)methods.push('<li><span class="no">No salt:</span> salt can scratch or damage this stone.</li>');
 const order=["bracelet","tumble","palm","tower","pendant"];
 const formTxt={bracelet:handTxt+" Wear it daily, and take it off while bathing"+(x.water?".":" or swimming, because water can damage it.")};
 say(`<div class="guide">
 <h3>Your ${x.n} guide</h3>
 <p>${x.does}${why?` It's a good match for ${esc(why)}.`:""}</p>
 <dl class="kv"><dt>Chakra</dt><dd>${x.ch}</dd><dt>Best worn on</dt><dd>${x.hand==="L"?"Left wrist":"Right wrist"}</dd><dt>Pairs well with</dt><dd>${x.pair.join(", ")}</dd></dl>

 <h3>Before first use: cleanse and charge</h3>
 <ul>${methods.join("")}</ul>
 <p style="margin-top:6px">Cleanse it when it arrives, then about once a week if you wear it daily, or once a month if it sits in a room.</p>

 <div class="aff">${x.aff}</div>

 </div>`,"t",true);
 quick([["Compare another crystal",START],["How do I wear two bracelets?",()=>reply2("two bracelets")],["Start over",()=>{say("<p>Sure. What would you like help with?</p>");START()}]]);
}

function findCrystal(t){const s=t.toLowerCase();return Object.keys(C).find(k=>{const n=C[k].n.toLowerCase();return s.includes(n)||s.includes(n.split(" ")[0])&&n.split(" ")[0].length>4})}
function reply2(t){
 if(/two bracelets|both (hands|wrists)|stack|two crystals/i.test(t)){say("<p>You can wear one on each wrist: a receiving stone on the left (like rose quartz or amethyst) and a protective or action stone on the right (like black tourmaline or tiger's eye). If you stack several on one wrist, keep similar hardness together so softer stones don't get scratched.</p>");START();return}
 if(/which hand|left or right|wrist/i.test(t)){say("<p>Traditionally the left hand receives and the right hand gives. Wear stones you want to draw in, like love, calm or abundance, on the left. Wear protective or action stones, like black tourmaline, pyrite or tiger's eye, on the right. Choose a crystal and I'll tell you which wrist suits it.</p>");START();return}
 if(/charge|cleanse|clean|full moon/i.test(t)){say("<p>The safest method for every crystal is moonlight: leave it on a windowsill overnight. Water and sunlight are fine for some stones but can damage others, like selenite, pyrite and lepidolite. Choose a crystal and I'll tell you exactly which methods are safe for it.</p>");START();return}
 if(/fake|real|genuine|original/i.test(t)){say("<p>Real crystals usually feel cool and heavy for their size, and natural colour is rarely perfectly even. Very bright or very cheap stones are often dyed or glass. Crystella pieces come from Sargum directly, so you can always ask her about a piece.</p>");START();return}
 say("<p>Tell me a bit more. What's on your mind lately: stress, sleep, love, money, focus, confidence, or something else?</p>");START();
}
function reply(text){
 const t=text.trim();if(!t)return;say(esc(t),"u");
 if(CRISIS.test(t)){say(`<span class="flag">Your safety first</span><p>I'm really sorry you're feeling this way. You deserve support from a real person right now, not a crystal.</p><p>Please call <b>Tele-MANAS on 14416</b> or <b>1-800-891-4416</b>, India's free mental health helpline, or call <b>112</b> if you're in immediate danger. If you can, reach out to someone you trust and let them know how you're feeling.</p>`);quick([["I'd like to talk about something else",START]]);return}
 const g=GUARD.find(g=>g.re.test(t));
 const found=CONCERNS.filter(c=>c.re.test(t));
 const named=findCrystal(t);
 if(g){say(`<span class="flag">Boundary</span><p>${g.m}</p>`);if(!found.length&&!named){START();return}}
 if(named&&!found.length){guide(named,"");return}
 if(found.length){suggest(found.slice(0,2));return}
 reply2(t);
}
$("f").addEventListener("submit",e=>{e.preventDefault();const v=$("in").value;$("in").value="";reply(v)});
say("<p>Hi, I'm the Crystella guide ✦</p><p>Tell me what's been going on lately, in your own words, and I'll suggest the crystals that fit. Once you choose one, I'll show you how to wear it, use it, cleanse and charge it.</p>");
START();
</script>
