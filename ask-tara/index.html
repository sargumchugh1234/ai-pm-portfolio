<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Tara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: one centred chat window in the Mysstical Tarot brand (plum + violet), quick replies under the latest message */
:root{
  --bg:#211B2E; --panel:#2A2339; --raise:#352C47; --ink:#F1ECF8; --muted:#B3A8C6; --line:#43385A;
  --violet:#9F76FF; --violet-soft:#3B2F5C; --warn:#F2B66D;
  --script:"Pacifico", "Brush Script MT", cursive;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:560px;margin:0 auto;height:100%;max-height:820px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--violet-soft);display:grid;place-items:center;flex:none}
.top .name{font-weight:600}
.top .sub{font-size:12px;color:var(--muted)}
.brand{margin-left:auto;text-align:right;line-height:1.1}
.brand .w{font-family:var(--script);color:var(--violet);font-size:17px}
.brand .by{font-size:9px;letter-spacing:.18em;color:var(--violet)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 13px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.m.t{align-self:flex-start;background:var(--raise);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:var(--violet);color:#1A1424;border-bottom-right-radius:4px}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m a{color:var(--violet);font-weight:600}
.flag{display:inline-block;font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 6px;margin-bottom:6px}
.card{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.card .face{width:54px;height:84px;border-radius:6px;border:1px solid var(--violet);display:grid;place-items:center;text-align:center;font-size:10px;color:var(--violet);padding:4px;flex:none;background:linear-gradient(var(--violet-soft),var(--bg))}
.card .face b{display:block;font-size:16px;font-weight:600}
.card .nm{font-weight:600}
.tier{background:var(--bg);border:1px solid var(--violet);border-radius:10px;padding:10px 12px;margin:6px 0}
.tier .nm{font-weight:600}.tier .pr{color:var(--violet);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.q{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--violet);background:transparent;color:var(--ink);cursor:pointer}
.q:hover{background:var(--violet-soft)}
form{display:flex;gap:8px;padding:0 16px 14px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.send{font:inherit;font-weight:600;padding:0 16px;border:0;border-radius:8px;background:var(--violet);color:#1A1424;cursor:pointer}
.q:focus-visible,.send:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.foot{max-width:560px;margin:10px auto 0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="avatar" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 15.6A7.5 7.5 0 0 1 15 3z" fill="#9F76FF"/><path d="M19 4l.7 1.6L21.3 6.3l-1.6.7L19 8.6l-.7-1.6-1.6-.7 1.6-.7z" fill="#F1ECF8"/></svg></div>
    <div><div class="name">Tara</div><div class="sub">Sargum's assistant · replies instantly</div></div>
    <div class="brand"><div class="w">Mysstical Tarot</div><div class="by">BY SARGUM</div></div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="f"><label for="in" hidden>Message</label><input id="in" autocomplete="off" placeholder="Ask Tara anything about readings"><button class="send" type="submit">Send</button></form>
</div>
<p class="foot">Portfolio prototype by Sargam Chugh for her tarot business. Tara helps visitors choose a reading, answers common questions and keeps clear boundaries.</p>

<script>
const SITE="https://mysstical-tarot.vercel.app";
const TIERS={
  spark:{n:"The Spark",t:"15 min",p:"₹666",w:"one focused situation"},
  deep:{n:"The Deep Dive",t:"20 min",p:"₹777",w:"room to go deeper on one area"},
  full:{n:"The Full Picture",t:"30 min",p:"₹1,111",w:"several life areas in one go"},
  couture:{n:"The Couture Session",t:"45 min",p:"₹1,515",w:"your whole story, unhurried"}
};
const CARDS=[
["0","The Fool","A fresh start is asking for a yes. Stop waiting for the perfect moment, it's not coming."],
["I","The Magician","You already have what you need. Use it before you go shopping for more."],
["II","The High Priestess","Your gut has been right this whole time. Listen to it, not the group chat."],
["III","The Empress","Rest is productive today. Nurture the thing you keep neglecting."],
["IV","The Emperor","Structure wins. Make the plan, then actually follow it."],
["V","The Hierophant","Ask someone who has done it before. Advice is not weakness."],
["VI","The Lovers","A choice is in front of you. Pick what matches your values, not your fears."],
["VII","The Chariot","Focus. You can't drive in two directions at once."],
["VIII","Strength","Soft is not weak. Patience will get you further than force today."],
["IX","The Hermit","Some quiet time will give you more answers than more opinions."],
["X","Wheel of Fortune","Things are moving. Stay ready, because the shift is closer than it looks."],
["XI","Justice","Be honest about your part in it. Fairness starts with you."],
["XII","The Hanged Man","Pause. Looking at it from a new angle will unlock it."],
["XIII","Death","Something is ending so something better can start. This card is about change, not loss."],
["XIV","Temperance","Balance, babe. Not everything needs to be all or nothing."],
["XV","The Devil","Notice the habit that keeps pulling you back. You hold the key."],
["XVI","The Tower","The shake-up clears space. What falls was not built to last."],
["XVII","The Star","Hope is back. Keep going, you're on the right path."],
["XVIII","The Moon","Not everything is clear yet. Don't decide on half the story."],
["XIX","The Sun","Good energy around you. Say yes to what lights you up."],
["XX","Judgement","Time to answer the call you've been ignoring."],
["XXI","The World","A chapter is completing. Celebrate it before you rush to the next one."]
];
const BOUND=[
 {re:/\b(doctor|medical|medicine|disease|illness|sick|cancer|surgery|diagnos|therapy|depress|mental health|symptom)/i,msg:"I can't help with health or medical questions, and the cards shouldn't replace a doctor. Please speak to a medical professional. If you'd like, a reading can look at the emotional side of what you're going through."},
 {re:/\b(pregnan|baby|conceive)/i,msg:"Sargum doesn't predict pregnancy. That's a question for a doctor, not the cards. A reading can help with the emotions around it, if that would help."},
 {re:/\b(die|death|dying|when will .* die|how long .* live)/i,msg:"We never predict death or how long someone will live. It's not something tarot should answer. If you're worried about someone, please reach out to people around you."},
 {re:/\b(lawyer|lawsuit|court|legal|case|divorce papers|visa)/i,msg:"I can't give legal advice. Please talk to a lawyer about this. A reading can help you think through how you feel and what you want, alongside proper advice."},
 {re:/\b(stock|invest|crypto|shares|trading|loan|lottery|betting|money advice)/i,msg:"I can't give financial or investment advice, and the cards won't pick your stocks. Please speak to a financial advisor. A career or money reading can look at your mindset and next steps."},
 {re:/\b(guarantee|100%|definitely|for sure|promise)/i,msg:"No honest reader can guarantee an outcome, and Sargum won't pretend to. Tarot shows the energy around you right now and what you can do about it. Your choices still shape what happens."},
 {re:/\b(free reading|full reading free|read for free|free session)/i,msg:"Full readings are with Sargum, so they're paid. But I can pull one free card for you right now, and new clients get the first 5 minutes free with code MYSSTICAL20."}
];
const FAQ=[
 {re:/\b(price|cost|charge|fee|how much|rates?)\b/i,a:()=>`<p>Couture Readings, same price on video or phone:</p><p>The Spark · 15 min · ₹666<br>The Deep Dive · 20 min · ₹777<br>The Full Picture · 30 min · ₹1,111<br>The Couture Session · 45 min · ₹1,515</p><p>Quick questions on WhatsApp start from ₹111. First 5 minutes free with code <b>MYSSTICAL20</b>.</p>`},
 {re:/\b(how does it work|how it works|process|what happens|online|google meet|call|phone|video)\b/i,a:()=>`<p>You tell Sargum what's on your mind, you pull the cards together live on Google Meet or a phone call, and you leave with clear next steps. You can ask as many questions as fit in your time.</p>`},
 {re:/\b(refund|cancel|reschedul|policy|policies)\b/i,a:()=>`<p>Cancellations and rescheduling are covered on the <a href="${SITE}/faq#policies" target="_blank" rel="noopener">policies page</a>. If something comes up, message Sargum as early as you can.</p>`},
 {re:/\b(where|pune|location|in person|event|stall)\b/i,a:()=>`<p>Sargum is based in Pune and reads online for people across India and abroad. She also sets up at flea markets and café pop-ups. See <a href="${SITE}/events" target="_blank" rel="noopener">upcoming events</a>.</p>`},
 {re:/\b(accurate|real|true|does tarot work|believe)\b/i,a:()=>`<p>Tarot is a guidance tool, not a fixed fate. It shows the energy around you and the actions that help. Clients mostly say Sargum is honest and specific. Read the <a href="${SITE}/wall-of-love" target="_blank" rel="noopener">Wall of Love</a> to see for yourself.</p>`},
 {re:/\b(numerology|crystal|crystals)\b/i,a:()=>`<p>Sargum also works with numerology and crystals. Ask her about them during your reading, or message on WhatsApp.</p>`}
];
const $=id=>document.getElementById(id);
const log=$("log");let state="idle",pick={};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function say(html,who="t"){const d=document.createElement("div");d.className="m "+who;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight}
function quick(list){const q=$("quick");q.innerHTML="";list.forEach(([label,fn])=>{const b=document.createElement("button");b.type="button";b.className="q";b.textContent=label;b.onclick=()=>{say(esc(label),"u");fn()};q.appendChild(b)})}
const MAIN=()=>quick([["Help me pick a reading",startPick],["Pull a card for me",startCard],["Prices",()=>{say(FAQ[0].a());MAIN()}],["How does it work?",()=>{say(FAQ[1].a());MAIN()}],["Book now",book]]);
function book(){say(`<p>Love that. <a href="${SITE}/book" target="_blank" rel="noopener">Book your reading here</a>. Use code <b>MYSSTICAL20</b> for the first 5 minutes free.</p><p>Prefer a quick answer? Send Sargum a question on WhatsApp from the <a href="${SITE}/contact" target="_blank" rel="noopener">contact page</a>, from ₹111.</p>`);MAIN()}
function startPick(){state="pick1";say("<p>Let's find your reading. What's on your mind?</p>");quick([["Love",()=>p1("love")],["Career",()=>p1("career")],["Money",()=>p1("money")],["Family",()=>p1("family")],["A bit of everything",()=>p1("many")]])}
function p1(a){pick.area=a;state="pick2";say("<p>And how much do you want to get into?</p>");quick([["One clear question",()=>p2(1)],["A few questions",()=>p2(2)],["Lots, I need to talk",()=>p2(3)],["My whole story",()=>p2(4)]])}
function p2(n){state="idle";let k=n===1?"spark":n===2?"deep":n===3?"full":"couture";if(pick.area==="many"&&k==="spark")k="full";if(pick.area==="many"&&k==="deep")k="full";const t=TIERS[k];
 const why=pick.area==="many"?"You're asking about more than one area, so you'll want the time to cover them properly.":`For ${pick.area}, this gives ${t.w}.`;
 say(`<p>I'd go with this one:</p><div class="tier"><div class="nm">${t.n}</div><div>${t.t} · <span class="pr">${t.p}</span></div><div>${why}</div></div><p>Unlimited questions in your time, on video or phone. <a href="${SITE}/book" target="_blank" rel="noopener">Book ${t.n}</a></p>`);MAIN()}
function startCard(){state="card";say("<p>Take a breath and think of one question. Type it, or just tap Draw.</p>");quick([["Draw",()=>draw("")]])}
function draw(q){state="idle";const c=CARDS[Math.floor(Math.random()*CARDS.length)];
 say(`${q?`<p>For "${esc(q)}":</p>`:""}<div class="card"><div class="face"><div><b>${c[0]}</b>${c[1]}</div></div><div><div class="nm">${c[1]}</div><div>${c[2]}</div></div></div><p>That's the headline. For what it means for your situation, Sargum reads the full spread with you.</p>`);
 quick([["Help me pick a reading",startPick],["Book now",book],["Pull another",startCard]])}
function reply(text){
 const t=text.trim();if(!t)return;say(esc(t),"u");
 for(const b of BOUND){if(b.re.test(t)){say(`<span class="flag">Boundary</span><p>${b.msg}</p>`);MAIN();return}}
 if(state==="card"){draw(t);return}
 if(/\b(book|appointment|slot|schedule)\b/i.test(t)){book();return}
 if(/\b(which reading|what reading|recommend|suggest|pick|choose)\b/i.test(t)){startPick();return}
 if(/\b(card|pull|draw)\b/i.test(t)){startCard();return}
 for(const f of FAQ){if(f.re.test(t)){say(f.a());MAIN();return}}
 if(/\b(will|should|does he|does she|ex|crush|job|promotion|marry|marriage)\b/i.test(t)){say(`<p>That's a real question, and it deserves a proper reading, not a one-line answer from me. Sargum will tell you exactly what the cards say, no sugarcoating.</p>`);quick([["Help me pick a reading",startPick],["Pull one card now",startCard],["Book now",book]]);return}
 say(`<p>I'm not sure I got that. I can help you pick a reading, pull a card, or answer questions about prices and how it works.</p>`);MAIN();
}
$("f").addEventListener("submit",e=>{e.preventDefault();const v=$("in").value;$("in").value="";reply(v)});
say("<p>Hey, I'm Tara ✦ Sargum's assistant.</p><p>I can help you pick the right reading, pull a quick card, or answer anything about how it works. What do you need?</p>");
MAIN();
</script>

</body>
</html>
